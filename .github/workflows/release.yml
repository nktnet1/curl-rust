name: Release nktnet-curl-sys

on:
  push:
    tags:
      - 'curl-sys-v*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Validate release tag
        id: crate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Only release commits already merged into the fork branch.
          if ! git merge-base --is-ancestor HEAD origin/fork; then
            echo '::error::Release tag must refer to a commit on fork.'
            exit 1
          fi
          python3 - <<'PY'
          import os
          import pathlib
          import tomllib

          package = tomllib.loads(pathlib.Path('curl-sys/Cargo.toml').read_text())['package']
          if package['name'] != 'nktnet-curl-sys':
              raise SystemExit('Unexpected crate name in curl-sys/Cargo.toml')

          version = package['version']
          tag = os.environ['RELEASE_TAG']
          # Existing curl-sys release names omit +curl-X.Y.Z build metadata.
          accepted = {f'curl-sys-v{version}', f"curl-sys-v{version.split('+', 1)[0]}"}
          if tag not in accepted:
              raise SystemExit(f'Tag {tag!r} does not match crate version {version!r}')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY

      - name: Check whether crate version is published
        id: registry
        env:
          CRATE_VERSION: ${{ steps.crate.outputs.version }}
        run: |
          encoded_version="$(python3 - <<'PY'
          import os
          from urllib.parse import quote

          print(quote(os.environ['CRATE_VERSION'], safe=''))
          PY
          )"
          status="$(curl --silent --show-error --location --retry 3 \
            --max-time 30 --output /dev/null --write-out '%{http_code}' \
            --user-agent 'nktnet-curl-sys GitHub Actions release' \
            "https://crates.io/api/v1/crates/nktnet-curl-sys/${encoded_version}")"
          case "$status" in
            200) echo 'published=true' >> "$GITHUB_OUTPUT" ;;
            404) echo 'published=false' >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::crates.io returned HTTP ${status}"; exit 1 ;;
          esac

      - name: Install Rust
        if: steps.registry.outputs.published == 'false'
        run: rustup update stable --no-self-update && rustup default stable

      - name: Authenticate with crates.io
        if: steps.registry.outputs.published == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish nktnet-curl-sys
        if: steps.registry.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cargo generate-lockfile
          cargo publish --manifest-path curl-sys/Cargo.toml --locked

  draft:
    name: Create draft GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release draft if absent
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json tagName > /dev/null 2>&1; then
            echo "GitHub release ${RELEASE_TAG} already exists."
            exit 0
          fi
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease \
            --generate-notes --title "$RELEASE_TAG"
